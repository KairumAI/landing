name: CI

# Pull requests must pass this check (ruleset "main"). Deploy independently
# verifies the exact integrated main SHA before publishing it.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun format:check
      - run: bun run check:reference
      - run: bun check
      - run: bun run test:delivery
      # Builds the site, serves it and runs the browser tests against the runner's Chrome.
      - run: bun run test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
