name: Deploy

# Bruno authorized automatic publication of verified main commits (ADR-0010).
# Other branches, tags and superseded retries cannot publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.current.outputs.publish }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Admit only the current main commit
        id: current
        run: bun scripts/check-publication-ref.ts
      - if: steps.current.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.current.outputs.publish == 'true'
        run: bun format:check
      - if: steps.current.outputs.publish == 'true'
        run: bun run check:reference
      - if: steps.current.outputs.publish == 'true'
        run: bun check
      - if: steps.current.outputs.publish == 'true'
        run: bun run test:delivery
      # Browser tests build the complete package and verify the published reports.
      - if: steps.current.outputs.publish == 'true'
        run: bun run test
      - name: Record the verified package digest
        id: manifest
        if: steps.current.outputs.publish == 'true'
        run: printf 'sha256=%s\n' "$(sha256sum build/public-delivery-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.current.outputs.publish == 'true'
        with:
          name: kairum-public-${{ github.sha }}
          path: |
            dist/
            build/public-delivery-manifest.json
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://kairum.com.ar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v7
        with:
          name: kairum-public-${{ github.sha }}
          path: verified-public/
      - name: Verify the exact tested package
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha256 }}
        run: bun scripts/verify-delivery-artifact.ts verified-public
      - name: Recheck main immediately before upload
        id: current
        run: bun scripts/check-publication-ref.ts
      - name: Publish the complete static site to the existing Pages project
        if: steps.current.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '1dde4cbeefbdfa598e7c64a4d8aad15f'
          bunx wrangler@4.147.0 pages deploy verified-public/dist --project-name kairum --branch main --commit-hash "$GITHUB_SHA"
      - name: Check the public landing, reports and excluded routes
        if: steps.current.outputs.publish == 'true'
        run: bun scripts/check-public-delivery-live.ts verified-public/build/public-delivery-manifest.json
      - name: Summarize the verified publication
        if: steps.current.outputs.publish == 'true'
        run: |
          printf 'Published commit `%s` to the existing Pages project `kairum`.\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '[Landing](https://kairum.com.ar) · [Informes](https://kairum.com.ar/informes/)\n' >> "$GITHUB_STEP_SUMMARY"
