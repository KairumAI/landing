name: Deploy

# Publishing a release (tag vX.Y.Z on main) proposes a deploy of that tag. The
# "production" environment only accepts v* tags and holds the deploy until
# Bruno approves it (decision 0007 in KairumAI/docs).
# "Run workflow" on an existing tag redeploys it, for example to roll back.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A newer release replaces a deploy still waiting for approval.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://kairum-landing.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag points to a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.147.0 pages deploy dist --project-name kairum-landing --branch main
